# Builds, tests, signs and releases the Android APK.
#
#   push to main / pull request  -> host unit tests + release APK as a workflow artifact
#   push a tag "v*"              -> same, plus a GitHub Release with the signed APK
#                                   (tags containing "-", e.g. v0.2.0-beta, become pre-releases)
# The same job also builds the Perfect Cherry Blossom app (:th07, signed with the same key)
# and uploads it as its own workflow artifact (th07-android-<version>); it is not attached to
# GitHub Releases yet.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of your release .jks (required for tags)
#   ANDROID_KEYSTORE_PASSWORD  keystore password            (required for tags)
#   ANDROID_KEY_ALIAS          key alias, default "release"  (optional)
#   ANDROID_KEY_PASSWORD       key password, default = keystore password (optional)
# Without the keystore secrets, branch builds are signed with a throwaway debug key so
# they still install for testing; tag builds refuse to run.

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0
  PLATFORM: android-36
  GRADLE_VERSION: 9.4.1
  ABIS: arm64-v8a

jobs:
  host-tests:
    name: Host unit tests (archives, LZSS, pool, game sim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned third-party sources
        uses: actions/cache@v6
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch pinned dependencies (SHA-256 verified)
        run: bash scripts/fetch_deps.sh

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

  android:
    name: Release APK
    needs: host-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # creating GitHub Releases on tag pushes
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse unsigned release tags
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Tag builds must be release-signed. Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android NDK and CMake
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - name: Set up Android SDK, NDK (side-by-side) and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;${{ env.PLATFORM }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Check NDK contents SDL2 needs
        run: |
          f="$ANDROID_HOME/ndk/$NDK_VERSION/sources/android/cpufeatures/cpu-features.c"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing. SDL2 2.32's CMake build compiles it; pick an NDK that still ships cpufeatures."
            exit 1
          fi
          echo "NDK OK: $ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Cache pinned third-party sources
        uses: actions/cache@v6
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch pinned dependencies (SHA-256 verified)
        run: bash scripts/fetch_deps.sh

      - name: Set up Gradle ${{ env.GRADLE_VERSION }} (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic   # MIT-licensed actions/cache implementation, free for any repo
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Compute version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            # A release tag must match the VERSION file (so the app knows its own version).
            if [[ "${name%%-*}" != "$base" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($base)"
              exit 1
            fi
          else
            name="${base}-dev+${GITHUB_SHA::7}"
          fi
          echo "TH06_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "TH06_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "APK_BASENAME=th06-android-${name//+/-}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TH06_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Passwords are passed to this step only, never written to GITHUB_ENV.
      - name: Build release APK (CMake via externalNativeBuild)
        env:
          TH06_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TH06_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TH06_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :th06:assembleRelease -Pth06.abis="$ABIS"

      # The Perfect Cherry Blossom app, signed with the same key: built here, before the next
      # step deletes the decoded keystore. Passwords again go to this step only.
      - name: Build th07 release APK (CMake via externalNativeBuild)
        env:
          TH06_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TH06_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TH06_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :th07:assembleRelease -Pth06.abis="$ABIS"

      - name: Verify signature and stage APK
        run: |
          apk=th06/build/outputs/apk/release/th06-release.apk
          test -f "$apk" || { echo "::error::$apk was not produced"; ls -R th06/build/outputs/apk || true; exit 1; }
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs "$apk"
          # The app cannot start without these three libraries for every ABI built.
          unzip -l "$apk" 'lib/*'
          for abi in ${ABIS//,/ }; do
            for lib in libmain.so libSDL2.so libc++_shared.so; do
              unzip -l "$apk" "lib/$abi/$lib" > /dev/null || { echo "::error::lib/$abi/$lib missing from the APK"; exit 1; }
            done
          done
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -c -P 16 4 "$apk" \
            && echo "Native libraries are 16 KB page aligned" \
            || echo "::warning::Native libraries are not 16 KB page aligned (needed by some Android 15+ devices)"
          mkdir -p dist
          suffix=""
          [ "$HAS_KEYSTORE" = "true" ] || suffix="-debugsigned"
          cp "$apk" "dist/${APK_BASENAME}${suffix}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature and stage th07 APK
        run: |
          apk=th07/build/outputs/apk/release/th07-release.apk
          test -f "$apk" || { echo "::error::$apk was not produced"; ls -R th07/build/outputs/apk || true; exit 1; }
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs "$apk"
          # Its own app id, so it installs next to the th06 app instead of over it.
          aapt2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          badging="$([ -x "$aapt2" ] && "$aapt2" dump badging "$apk" 2>/dev/null || true)"
          if [ -n "$badging" ]; then
            package_line="$(printf '%s\n' "$badging" | grep -m 1 '^package:' || true)"
            echo "$package_line"
            case "$package_line" in
              *"name='io.github.cng605568art.th07'"*) ;;
              *) echo "::error::th07 APK does not have the app id io.github.cng605568art.th07"; exit 1 ;;
            esac
          else
            echo "::warning::aapt2 dump badging unavailable; app id not checked"
          fi
          # The app cannot start without these three libraries for every ABI built.
          unzip -l "$apk" 'lib/*'
          for abi in ${ABIS//,/ }; do
            for lib in libmain.so libSDL2.so libc++_shared.so; do
              unzip -l "$apk" "lib/$abi/$lib" > /dev/null || { echo "::error::lib/$abi/$lib missing from the th07 APK"; exit 1; }
            done
          done
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -c -P 16 4 "$apk" \
            && echo "th07: native libraries are 16 KB page aligned" \
            || echo "::warning::th07: native libraries are not 16 KB page aligned (needed by some Android 15+ devices)"
          base="th07-android-${TH06_VERSION_NAME//+/-}"
          echo "TH07_APK_BASENAME=$base" >> "$GITHUB_ENV"
          mkdir -p dist-th07
          suffix=""
          [ "$HAS_KEYSTORE" = "true" ] || suffix="-debugsigned"
          cp "$apk" "dist-th07/${base}${suffix}.apk"
          (cd dist-th07 && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Unstripped native libraries, to turn the addresses in a player's crash log
      # (libmain.so+0x...) back into function names and lines.
      - name: Stage native debug symbols
        run: |
          mkdir -p symbols
          for abi in ${ABIS//,/ }; do
            lib=$(find th06/build/intermediates -path "*merged_native_libs*" -path "*/$abi/*" -name libmain.so | head -n 1)
            if [ -n "$lib" ]; then
              mkdir -p "symbols/$abi" && cp "$lib" "symbols/$abi/libmain.so"
            else
              echo "::warning::No unstripped libmain.so found for $abi"
            fi
          done

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ env.APK_BASENAME }}
          path: symbols/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Stage th07 native debug symbols
        run: |
          mkdir -p symbols-th07
          for abi in ${ABIS//,/ }; do
            lib=$(find th07/build/intermediates -path "*merged_native_libs*" -path "*/$abi/*" -name libmain.so | head -n 1)
            if [ -n "$lib" ]; then
              mkdir -p "symbols-th07/$abi" && cp "$lib" "symbols-th07/$abi/libmain.so"
            else
              echo "::warning::No unstripped th07 libmain.so found for $abi"
            fi
          done

      - name: Upload th07 native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ env.TH07_APK_BASENAME }}
          path: symbols-th07/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload th07 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TH07_APK_BASENAME }}
          path: dist-th07/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
