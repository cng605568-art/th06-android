# Builds, tests, signs and releases the Android APK.
#
#   push to main / pull request  -> host unit tests + release APK as a workflow artifact
#   push a tag "v*"              -> same, plus a GitHub Release with the signed APKs (and the
#                                   unsigned TH07 IPA from the iOS job)
#                                   (tags containing "-", e.g. v0.2.0-beta, become pre-releases)
# The release job builds four APKs, all signed with the same key: Touhou Launcher (:launcher,
# TH06, TH07 and TH08 in one app: touhou-launcher-android-<version>) and each game's standalone
# app (:th06-app, :th07-app, :th08-app: th06-, th07- and th08-android-<version>), each uploaded
# as its own workflow artifact and attached to the release (checksums in SHA256SUMS*.txt).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of your release .jks (required for tags)
#   ANDROID_KEYSTORE_PASSWORD  keystore password            (required for tags)
#   ANDROID_KEY_ALIAS          key alias, default "release"  (optional)
#   ANDROID_KEY_PASSWORD       key password, default = keystore password (optional)
# Without the keystore secrets, branch builds are signed with a throwaway debug key so
# they still install for testing; tag builds refuse to run.

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0
  PLATFORM: android-36
  GRADLE_VERSION: 9.4.1
  ABIS: arm64-v8a

jobs:
  host-tests:
    name: Host unit tests (archives, LZSS, pool, game sim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned third-party sources
        uses: actions/cache@v6
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch pinned dependencies (SHA-256 verified)
        run: bash scripts/fetch_deps.sh

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

  android:
    name: Release APK
    needs: host-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # creating GitHub Releases on tag pushes
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse unsigned release tags
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Tag builds must be release-signed. Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android NDK and CMake
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - name: Set up Android SDK, NDK (side-by-side) and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;${{ env.PLATFORM }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Check NDK contents SDL2 needs
        run: |
          f="$ANDROID_HOME/ndk/$NDK_VERSION/sources/android/cpufeatures/cpu-features.c"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing. SDL2 2.32's CMake build compiles it; pick an NDK that still ships cpufeatures."
            exit 1
          fi
          echo "NDK OK: $ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Cache pinned third-party sources
        uses: actions/cache@v6
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch pinned dependencies (SHA-256 verified)
        run: bash scripts/fetch_deps.sh

      - name: Set up Gradle ${{ env.GRADLE_VERSION }} (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic   # MIT-licensed actions/cache implementation, free for any repo
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Compute version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            # A release tag must match the VERSION file (so the app knows its own version).
            if [[ "${name%%-*}" != "$base" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($base)"
              exit 1
            fi
          else
            name="${base}-dev+${GITHUB_SHA::7}"
          fi
          echo "TH06_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "TH06_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "APK_BASENAME=th06-android-${name//+/-}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TH06_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Every app in one Gradle run, signed with the same key: the three games' standalone apps
      # and Touhou Launcher (all three in one app). The game libraries' native code is built
      # once and packaged by both. Passwords are passed to this step only, never written to
      # GITHUB_ENV; the next step deletes the decoded keystore.
      - name: Build the release APKs (CMake via externalNativeBuild)
        env:
          TH06_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TH06_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TH06_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon --stacktrace -Pth06.abis="$ABIS"
          :th06-app:assembleRelease :th07-app:assembleRelease :th08-app:assembleRelease :launcher:assembleRelease

      - name: Verify signatures and stage the APKs
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          v="${TH06_VERSION_NAME//+/-}"
          scripts/stage_apk.sh apps/th06/build/outputs/apk/release/th06-app-release.apk io.github.cng605568art.th06 \
            "libth06main.so libSDL2.so libc++_shared.so" dist "th06-android-$v" SHA256SUMS.txt
          scripts/stage_apk.sh apps/th07/build/outputs/apk/release/th07-app-release.apk io.github.cng605568art.th07 \
            "libth07main.so libSDL2.so libc++_shared.so" dist-th07 "th07-android-$v" SHA256SUMS-th07.txt
          scripts/stage_apk.sh apps/th08/build/outputs/apk/release/th08-app-release.apk io.github.cng605568art.th08 \
            "libth08main.so libSDL2.so libc++_shared.so" dist-th08 "th08-android-$v" SHA256SUMS-th08.txt
          scripts/stage_apk.sh launcher/build/outputs/apk/release/launcher-release.apk io.github.cng605568art.touhou \
            "libth06main.so libth07main.so libth08main.so libSDL2.so libc++_shared.so" \
            dist-launcher "touhou-launcher-android-$v" SHA256SUMS-launcher.txt
          echo "TH07_APK_BASENAME=th07-android-$v" >> "$GITHUB_ENV"
          echo "TH08_APK_BASENAME=th08-android-$v" >> "$GITHUB_ENV"
          echo "LAUNCHER_APK_BASENAME=touhou-launcher-android-$v" >> "$GITHUB_ENV"

      # Unstripped native libraries, to turn the addresses in a player's crash log
      # (libth08main.so+0x...) back into function names and lines. Touhou Launcher packages
      # the same libraries, so these serve its crash logs too.
      - name: Stage native debug symbols
        run: |
          for game in th06 th07 th08; do
            for abi in ${ABIS//,/ }; do
              # The game library's CMake output (before any stripping), else what the app merged.
              lib=$(find "$game/build/intermediates/cxx" -path "*/obj/$abi/*" -name "lib${game}main.so" 2>/dev/null | head -n 1)
              [ -n "$lib" ] || lib=$(find "apps/$game/build/intermediates" -path "*merged_native_libs*" -path "*/$abi/*" -name "lib${game}main.so" | head -n 1)
              if [ -n "$lib" ]; then
                mkdir -p "symbols-$game/$abi" && cp "$lib" "symbols-$game/$abi/lib${game}main.so"
              else
                echo "::warning::No unstripped lib${game}main.so found for $abi"
              fi
            done
          done

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ env.APK_BASENAME }}
          path: symbols-th06/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_BASENAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload th07 native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ env.TH07_APK_BASENAME }}
          path: symbols-th07/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload th07 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TH07_APK_BASENAME }}
          path: dist-th07/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload th08 native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols-${{ env.TH08_APK_BASENAME }}
          path: symbols-th08/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload th08 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TH08_APK_BASENAME }}
          path: dist-th08/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Touhou Launcher APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LAUNCHER_APK_BASENAME }}
          path: dist-launcher/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-launcher/*.apk
            dist-launcher/SHA256SUMS-launcher.txt
            dist/*.apk
            dist/SHA256SUMS.txt
            dist-th07/*.apk
            dist-th07/SHA256SUMS-th07.txt
            dist-th08/*.apk
            dist-th08/SHA256SUMS-th08.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  ios:
    name: iOS app (unsigned IPA, TH07)
    needs: host-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned third-party sources
        uses: actions/cache@v6
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch pinned dependencies (SHA-256 verified)
        run: bash scripts/fetch_deps.sh

      - name: Compute version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="${base}-dev+${GITHUB_SHA::7}"; fi
          echo "TH07_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "IPA_BASENAME=th07-ios-${name//+/-}" >> "$GITHUB_ENV"

      - name: Build the app (iPhone, arm64)
        run: |
          xcodebuild -version
          cmake -S th07/src/main/cpp -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 -DCMAKE_BUILD_TYPE=Release \
            -DTH07_VERSION="$TH07_VERSION_NAME" -DTH07_BUILD="$GITHUB_RUN_NUMBER"
          cmake --build build-ios --parallel --target TH07Port

      - name: Package the unsigned IPA
        run: |
          bash scripts/package_ios.sh build-ios/TH07Port.app iphoneos "dist-ios/${IPA_BASENAME}.ipa"
          (cd dist-ios && shasum -a 256 *.ipa > SHA256SUMS-ios.txt && cat SHA256SUMS-ios.txt)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IPA_BASENAME }}
          path: dist-ios/*
          if-no-files-found: error
          retention-days: 30

      # A launch in the iOS Simulator (no game files there: the status screen) with a
      # screenshot and the app's log, so a start-up failure shows without a phone.
      - name: Simulator smoke test
        continue-on-error: true
        run: |
          cmake -S th07/src/main/cpp -B build-sim -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sim --parallel --target TH07Port
          bash scripts/package_ios.sh build-sim/TH07Port.app iphonesimulator
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')"
          echo "Simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build-sim/TH07Port.app
          xcrun simctl launch "$udid" io.github.cng605568art.th07
          sleep 25
          mkdir -p sim-out
          xcrun simctl io "$udid" screenshot sim-out/launch.png
          # The screenshot as text in this log (artifacts may not be reachable): mean colour and
          # a coarse brightness map.
          sips -s format bmp sim-out/launch.png --out sim-out/launch.bmp >/dev/null
          python3 - sim-out/launch.bmp <<'PY'
          import struct, sys
          b = open(sys.argv[1], 'rb').read()
          off, w, h, bpp = struct.unpack_from('<I', b, 10)[0], *struct.unpack_from('<ii', b, 18), struct.unpack_from('<H', b, 28)[0]
          step, row = bpp // 8, ((w * (bpp // 8) + 3) // 4) * 4
          flip = h > 0; h = abs(h)
          def px(x, y):
              yy = h - 1 - y if flip else y
              p = off + yy * row + x * step
              return b[p + 2], b[p + 1], b[p]
          s = [0, 0, 0]; n = 0
          for y in range(0, h, 7):
              for x in range(0, w, 7):
                  r, g, bl = px(x, y); s[0] += r; s[1] += g; s[2] += bl; n += 1
          print(f"screenshot {w}x{h}, mean RGB {s[0]//n} {s[1]//n} {s[2]//n}")
          ramp = " .:-=+*#%@"
          cols, rows = 96, 32
          for j in range(rows):
              line = ""
              for i in range(cols):
                  r, g, bl = px(i * w // cols, j * h // rows)
                  line += ramp[min(9, (r * 3 + g * 6 + bl) // 10 * 10 // 256)]
              print("|" + line + "|")
          PY
          data="$(xcrun simctl get_app_container "$udid" io.github.cng605568art.th07 data)"
          ls -laR "$data/Documents" || true
          cp "$data/Documents/Saves/logs/session.log" sim-out/ 2>/dev/null || true
          cat sim-out/session.log 2>/dev/null || echo "(no session log)"
          xcrun simctl spawn "$udid" log show --last 2m --predicate 'process == "TH07Port"' --style compact > sim-out/system.log 2>&1 || true
          tail -50 sim-out/system.log || true

      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-${{ env.IPA_BASENAME }}
          path: sim-out/*
          if-no-files-found: ignore
          retention-days: 14

  ios-release:
    name: Attach the IPA to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: th07-ios-*
          path: dist-ios
          merge-multiple: true
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-ios/*.ipa
            dist-ios/SHA256SUMS-ios.txt
          fail_on_unmatched_files: true
