plugins {
    id 'com.android.application'
}

// The standalone Perfect Cherry Blossom app (TH07 alone, as before Touhou Launcher): the :th07 game
// library under the app id the released TH07 app has always had, so it updates in place.

android {
    namespace = 'io.github.cng605568art.th07.app'  // (the game library owns io.github.cng605568art.th07)

    defaultConfig {
        applicationId = 'io.github.cng605568art.th07'
    }
}

dependencies {
    implementation project(':th07')
}

apply from: rootProject.file('gradle/touhou-app.gradle')
